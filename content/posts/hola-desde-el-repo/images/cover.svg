<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="800" height="420" fill="#0A0E17"/>

  <!-- pixel grid dots -->
  <g fill="#151b2e">
    <rect x="0" y="0" width="800" height="420" fill="none"/>
  </g>
  <g fill="#12182b">
    <rect x="0" y="20" width="800" height="2"/>
    <rect x="0" y="60" width="800" height="2"/>
    <rect x="0" y="100" width="800" height="2"/>
    <rect x="0" y="140" width="800" height="2"/>
    <rect x="0" y="180" width="800" height="2"/>
    <rect x="0" y="220" width="800" height="2"/>
    <rect x="0" y="260" width="800" height="2"/>
    <rect x="0" y="300" width="800" height="2"/>
    <rect x="0" y="340" width="800" height="2"/>
    <rect x="0" y="380" width="800" height="2"/>
  </g>

  <!-- terminal window -->
  <rect x="120" y="90" width="560" height="240" fill="#0e1426" stroke="#232d47" stroke-width="4"/>
  <rect x="120" y="90" width="560" height="34" fill="#111830"/>
  <rect x="140" y="104" width="14" height="14" fill="#e05252"/>
  <rect x="166" y="104" width="14" height="14" fill="#E8A25E"/>
  <rect x="192" y="104" width="14" height="14" fill="#3b82f6"/>

  <!-- pixel folder icon -->
  <g transform="translate(160,150)">
    <rect x="0" y="20" width="90" height="60" fill="#E8A25E"/>
    <rect x="0" y="10" width="40" height="10" fill="#E8A25E"/>
    <rect x="6" y="30" width="78" height="40" fill="#0A0E17"/>
  </g>

  <!-- pixel arrow -->
  <g fill="#E8A25E">
    <rect x="270" y="195" width="60" height="10"/>
    <rect x="310" y="185" width="10" height="10"/>
    <rect x="310" y="215" width="10" height="10"/>
    <rect x="320" y="175" width="10" height="10"/>
    <rect x="320" y="225" width="10" height="10"/>
  </g>

  <!-- pixel globe / repo -->
  <g transform="translate(360,150)">
    <rect x="10" y="0" width="60" height="60" fill="none" stroke="#3b82f6" stroke-width="6"/>
    <rect x="10" y="20" width="60" height="6" fill="#3b82f6"/>
    <rect x="10" y="40" width="60" height="6" fill="#3b82f6"/>
    <rect x="37" y="0" width="6" height="60" fill="#3b82f6"/>
  </g>

  <!-- terminal text lines -->
  <g fill="#F2F2F0" font-family="'IBM Plex Mono', monospace" font-size="16">
    <text x="140" y="270">$ git push origin main</text>
    <text x="140" y="295" fill="#8fd0ff">✓ content/posts/hola-desde-el-repo</text>
  </g>

  <text x="400" y="370" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#E8A25E" letter-spacing="2">
    HOLA DESDE EL REPO
  </text>
</svg>
